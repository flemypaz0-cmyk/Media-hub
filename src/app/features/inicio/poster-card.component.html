<article class="card" tabindex="0" (click)="opened.emit(entry())" (keydown.enter)="opened.emit(entry())">
  <div class="card-poster" #poster (mouseenter)="onEnter(poster)" (mouseleave)="onLeave()">
    <div class="ph"><mh-art [seed]="seed()" /><span>{{ entry().title }}</span></div>

    @if (showVideoPreview()) {
      <video
        class="hpv-video"
        [src]="entry().source || '/assets/media/clip-01.mp4'"
        autoplay
        loop
        muted
        playsinline
      ></video>
    }

    <div class="hover-play-overlay" aria-hidden="true">
      <div class="hpo-circle">
        <mh-icon name="play" [size]="24" />
      </div>
    </div>

    @if (entry().quality) {
      <div class="badge badge-tl res">{{ entry().quality }}</div>
    }
    @if (entry().rating && entry().rating > 0) {
      <div class="badge rating" style="position: absolute; bottom: 8px; left: 8px; z-index: 3">
        ★ {{ entry().rating }}
      </div>
    }
    @if (entry().watched) {
      <div class="badge badge-br"><mh-icon name="check" [size]="13" /></div>
    }
    @if (progress() > 0) {
      <div class="progress-line poster-progress" style="z-index: 3"><i [style.width.%]="progress()"></i></div>
    }

    <div class="card-actions" style="z-index: 4">
      <button class="icon-btn" type="button" title="Editar" aria-label="Editar" (click)="stop($event); edited.emit(entry())">
        <mh-icon name="edit" [size]="18" />
      </button>
      <button class="icon-btn" type="button" title="Favorito" aria-label="Favorito" (click)="stop($event); favoriteToggled.emit(entry())">
        <mh-icon name="heart" [size]="18" [style.color]="entry().favorite ? '#ff5252' : 'inherit'" />
      </button>
    </div>
  </div>

  <div class="card-body">
    <div class="card-title">{{ entry().title }}</div>
    <div class="card-meta">{{ meta() }}</div>
  </div>
</article>
